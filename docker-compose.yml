# Launched by bin/phase-runner, which exports the project's .phase-runner/runner.env
# plus the computed variables (PROJECT_DIR, PHASE_FILES, CREDENTIALS_FILE,
# AGENT_HOME, RUNNER_MODE, HOST_SSH_AUTH_SOCK) before calling compose.
# Do not `docker compose run` this directly.
services:
  runner:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    image: claude-phase-runner:latest
    # The agent's own credentials (user-level, never inside the project), so the
    # agent can freely manage the project's .env without touching its token.
    env_file:
      - path: ${CREDENTIALS_FILE}
        required: true
    environment:
      RUNNER_MODE: ${RUNNER_MODE:-build}
      PROJECT_DIR: ${PROJECT_DIR}
      ENTRY_FILE: ${ENTRY_FILE}
      PHASE_FILES: ${PHASE_FILES}
      GATE_CMD: ${GATE_CMD:-}
      # reviewer / fix loop
      PHASE_REVIEW: ${PHASE_REVIEW:-1}
      MAX_FIX_ROUNDS: ${MAX_FIX_ROUNDS:-2}
      COMMIT_REVIEWS: ${COMMIT_REVIEWS:-0}
      REVIEWS_DIR: ${REVIEWS_DIR:-docs/verification}
      REVIEW_PROMPT: ${REVIEW_PROMPT:-}
      # models, effort, spend caps
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      BUILD_MODEL: ${BUILD_MODEL:-}
      FIX_MODEL: ${FIX_MODEL:-}
      REVIEW_MODEL: ${REVIEW_MODEL:-}
      SUBAGENT_MODEL: ${SUBAGENT_MODEL:-}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-}
      BUILD_EFFORT: ${BUILD_EFFORT:-}
      FIX_EFFORT: ${FIX_EFFORT:-}
      REVIEW_EFFORT: ${REVIEW_EFFORT:-}
      BUILD_BUDGET_USD: ${BUILD_BUDGET_USD:-}
      REVIEW_BUDGET_USD: ${REVIEW_BUDGET_USD:-}
      # context hygiene, fix-round context
      BASH_OUTPUT_MAX_CHARS: ${BASH_OUTPUT_MAX_CHARS:-}
      FIX_CONTEXT: ${FIX_CONTEXT:-fresh}
      # resilience
      RETRY_SCHEDULE: ${RETRY_SCHEDULE:-30 300 3600 10800}
      STALL_TIMEOUT: ${STALL_TIMEOUT:-1800}
      GATE_TIMEOUT: ${GATE_TIMEOUT:-3600}
      LIMIT_WAIT_MAX: ${LIMIT_WAIT_MAX:-21600}
      GUARD: ${GUARD:-1}
      # git
      GIT_REMOTE: ${GIT_REMOTE:-origin}
      GIT_BRANCH: ${GIT_BRANCH:-}
      PUSH: ${PUSH:-1}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Phase Runner}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-runner@phase.local}
    volumes:
      # The project at the same path the host sees, so any compose bind mounts
      # inside the project still resolve when the agent runs `docker compose up`
      # against the host daemon (docker-out-of-docker). Runner state lives in
      # <project>/.phase-runner/state, inside this mount.
      - ${PROJECT_DIR}:${PROJECT_DIR}
      # Host Docker daemon, for the project's stack + test containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # The agent's ~/.claude: drop skills/, agents/, plugins here; sessions
      # persist so interrupted runs can be resumed by id.
      - ${AGENT_HOME}:/home/node/.claude
      # Forwarded SSH agent for `git push` (the CLI points this at the real
      # socket when one exists, or at /dev/null otherwise).
      - ${HOST_SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      # Live kit code over the baked copy: driver, libs, guard and prompts can be
      # edited without an image rebuild.
      - ./docker:/opt/phase-runner/docker:ro
      - ./prompts:/opt/phase-runner/prompts:ro
    working_dir: ${PROJECT_DIR}
    # DooD means the project's stack runs as SIBLING containers with ports
    # published on the host — 127.0.0.1 inside this container cannot reach
    # them. host.docker.internal resolves to the host gateway instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
